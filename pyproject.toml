[project]
name = "credit-drift"
version = "1.0.0"
description = "Observabilidade, drift e governança para um modelo de Credit Scoring (Tech Challenge Fase 04 FIAP)"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandera>=0.20",
    "evidently>=0.7",
    "mlflow>=2.14",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213", "D104", "D100"]

[tool.ruff.lint.per-file-ignores]
"scripts/03_build_dashboard.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning", "ignore::UserWarning"]
